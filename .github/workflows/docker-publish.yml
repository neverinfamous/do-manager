name: Build and Push Docker Images

on:
  push:
    tags: ["v*"]
  pull_request:
    branches: [main]

env:
  REGISTRY: docker.io
  IMAGE_NAME: writenotenow/do-manager
  # Force JavaScript-based GitHub Actions in this workflow to run on Node 24.
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

permissions:
  contents: read
  packages: write
  security-events: write # For security scanning
  pull-requests: write # For PR comments
  id-token: write # For supply chain attestations
  attestations: write # For generating attestations

jobs:
  # Gate: Linting must pass before Docker build
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: "24.x"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run ESLint
        run: pnpm run lint

  # Gate: CodeQL security analysis must pass before Docker build
  codeql:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: "javascript-typescript"
          queries: security-extended,security-and-quality

      - name: Autobuild
        uses: github/codeql-action/autobuild@v4

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:javascript-typescript"

  # Build each platform on native architecture (avoids QEMU emulation issues)
  build-platform:
    needs: [lint, codeql]
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm

    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write

    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f

      - name: Log in to Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Read version from package.json
        id: version
        run: |
          VERSION=$(jq -r '.version // empty' package.json || echo "")
          if [ -z "$VERSION" ] || [ "$VERSION" = "null" ]; then
            echo "Error: Failed to extract version from package.json" >&2
            exit 1
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Detected version: $VERSION"

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          flavor: |
            latest=false
            suffix=-${{ matrix.platform == 'linux/amd64' && 'amd64' || 'arm64' }}
          tags: |
            type=sha,prefix=sha-,format=short

      - name: Build and push platform image
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        with:
          context: .
          file: Dockerfile
          platforms: ${{ matrix.platform }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.platform }}
          cache-to: type=gha,scope=${{ matrix.platform }},mode=max
          provenance: mode=max
          sbom: true

      - name: Export digest
        if: github.event_name != 'pull_request'
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload digest
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: digests-${{ matrix.platform == 'linux/amd64' && 'amd64' || 'arm64' }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  # Security scan on amd64 image with strict gates (blocks on critical/high)
  security-scan:
    runs-on: ubuntu-latest
    needs: build-platform
    if: github.event_name != 'pull_request'
    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f

      - name: Verify pnpm-lock.yaml has security fixes
        run: |
          echo "🔍 Verifying security patches in pnpm-lock.yaml..."
          if grep -E "^  /cross-spawn@(7\.0\.[5-9]|7\.[1-9]|8|9)" pnpm-lock.yaml > /dev/null; then
            echo "✅ cross-spawn version is secure"
          else
            echo "❌ ERROR: cross-spawn version is vulnerable (need >= 7.0.5)"
            exit 1
          fi
          if grep -E "^  /brace-expansion@2\.0\.2" pnpm-lock.yaml > /dev/null; then
            echo "✅ brace-expansion version is secure"
          else
            echo "⚠️  WARNING: brace-expansion version not 2.0.2"
          fi
          echo "✅ Security patches verified in pnpm-lock.yaml"

      - name: Build image for scanning
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          push: false
          load: true
          tags: local-scan:latest
          cache-from: type=gha,scope=linux/amd64

      - name: Docker Scout security scan
        timeout-minutes: 10
        run: |
          curl -sSfL https://raw.githubusercontent.com/docker/scout-cli/main/install.sh | sh -s --
          docker images local-scan:latest
          echo "🔍 Running Docker Scout security scan for local-scan:latest"

          echo "⏱️ Running Docker Scout scan (max 8 minutes)..."
          if timeout 480 docker scout cves local-scan:latest > scout_output.txt 2>&1; then
            echo "📊 Scan completed successfully"
            cat scout_output.txt
            
            # Check if critical or high vulnerabilities are present in the output
            # Look for non-zero counts in CRITICAL or HIGH columns (format: "1C" or "2H")
            if grep -E "^\s+[1-9][0-9]*C\s+" scout_output.txt > /dev/null; then
              echo "❌ Critical severity vulnerabilities detected"
              echo "🚨 Build blocked due to unacceptable security risk"
              exit 1
            fi
            
            # Check for HIGH vulnerabilities, but exclude the known wrangler bundled cross-spawn issue
            if grep -E "^\s+0C\s+[1-9][0-9]*H\s+" scout_output.txt > /dev/null; then
              # Check if it's ONLY the cross-spawn 7.0.3 from wrangler (known issue)
              if grep "cross-spawn 7.0.3" scout_output.txt > /dev/null; then
                HIGH_COUNT=$(grep -E "^\s+0C\s+[1-9][0-9]*H\s+" scout_output.txt | wc -l)
                CROSS_SPAWN_COUNT=$(grep "cross-spawn 7.0.3" scout_output.txt | wc -l)
                
                if [ "$HIGH_COUNT" -eq 1 ] && [ "$CROSS_SPAWN_COUNT" -ge 1 ]; then
                  echo "⚠️  Known issue: cross-spawn 7.0.3 bundled in wrangler (cannot be patched)"
                  echo "ℹ️  This is a dev-time dependency in wrangler, not a runtime risk"
                  echo "✅ Security scan passed - only known wrangler bundled dependency issue"
                else
                  echo "❌ High severity vulnerabilities detected (excluding known wrangler issue)"
                  echo "🚨 Build blocked due to unacceptable security risk"
                  exit 1
                fi
              else
                echo "❌ High severity vulnerabilities detected"
                echo "🚨 Build blocked due to unacceptable security risk"
                exit 1
              fi
            else
              echo "✅ Security scan passed - no critical/high severity vulnerabilities"
              echo "ℹ️ Low/medium severity vulnerabilities are acceptable"
            fi
          else
            echo "⚠️ Docker Scout scan timed out or failed"
            echo "🔄 Continuing build - scan timeout is not a security failure"
            echo "ℹ️ Consider running scout scan locally for large images"
          fi

  # Merge platform images into multi-arch manifest
  merge-and-push:
    runs-on: ubuntu-latest
    needs: [build-platform, security-scan]
    if: github.event_name != 'pull_request'
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
      deployments: write

    environment:
      name: ${{ startsWith(github.ref, 'refs/tags/v') && 'production' || '' }}
      url: https://hub.docker.com/r/writenotenow/do-manager

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download digests
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          path: /tmp/digests
          pattern: digests-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f

      - name: Log in to Docker Hub
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Read version
        id: version
        run: |
          VERSION=$(jq -r '.version // empty' package.json || echo "")
          if [ -z "$VERSION" ] || [ "$VERSION" = "null" ]; then
            echo "Error: Failed to extract version from package.json" >&2
            exit 1
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Extract metadata for manifest
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          flavor: |
            latest=auto
          tags: |
            type=semver,pattern=v{{version}}
            type=raw,value=v${{ steps.version.outputs.version }},enable=${{ github.event_name != 'pull_request' }}
            type=raw,value=latest,enable=${{ github.event_name != 'pull_request' }}
            type=sha,prefix=sha-,format=short

      - name: Create and push manifest
        working-directory: /tmp/digests
        run: |
          docker buildx imagetools create $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf '${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@sha256:%s ' *)

      - name: Inspect manifest
        run: |
          docker buildx imagetools inspect ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.version }}

      # Update Docker Hub description
      - name: Update Docker Hub Description
        if: startsWith(github.ref, 'refs/tags/v')
        uses: peter-evans/dockerhub-description@432a30c9e07499fd01da9f8a49f0faf9e0ca5b77
        continue-on-error: true
        timeout-minutes: 5
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
          repository: ${{ env.IMAGE_NAME }}
          readme-filepath: ./DOCKER_README.md
          short-description: "Cloudflare DO Manager – Instance Tools, SQL Access, Batch Ops, Global Search, Backups, GitHub SSO."

      - name: Deployment Summary
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          echo "✅ Successfully published Docker images to production"
          echo "🐳 Registry: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}"
          echo "🏷️ Tags: ${{ steps.meta.outputs.tags }}"
          echo "📝 Commit: ${{ github.sha }}"
          echo "👤 Published by: ${{ github.actor }}"
